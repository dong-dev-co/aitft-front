    <circle cx="462" cy="262" r="28"/><circle cx="462" cy="638" r="28"/>
    <circle cx="614" cy="402" r="28"/><circle cx="614" cy="498" r="28"/>
  </g>
  <circle cx="462" cy="450" r="106" fill="#D9FF4B"/>
