    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <g opacity=".16" stroke="#71809A" stroke-width="1"><path d="M80 130H1520M80 770H1520"/><path d="M112 80V820M1488 80V820"/></g>
